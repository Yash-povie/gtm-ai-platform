[project]
name = "gtm-safety"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gtm-integrations",
    "gtm-core",
    "pyjwt>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_safety"]

[tool.uv.sources]
gtm-core = { workspace = true }
gtm-integrations = { workspace = true }
