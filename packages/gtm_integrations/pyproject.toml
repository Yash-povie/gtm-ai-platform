[project]
name = "gtm-integrations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gtm-core",
    "httpx>=0.27",
    "tenacity>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_integrations"]

[tool.uv.sources]
gtm-core = { workspace = true }
