x-app-env: &app-env
  GTM_ENV: sandbox
  DATABASE_URL: postgresql+asyncpg://gtm:gtm_pass@postgres:5432/gtm_platform
  REDIS_URL: redis://redis:6379/0
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: neo4j_pass
  PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gtm
      POSTGRES_PASSWORD: gtm_pass
      POSTGRES_DB: gtm_platform
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm -d gtm_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/neo4j_pass
      NEO4J_PLUGINS: '["apoc"]'
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_pass 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./systems/sys2_signal_engine/n8n_workflows:/workflows

  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006", "4317:4317"]

  api:
    build: { context: ., target: api }
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }

volumes:
  pg_data:
  neo4j_data:
  n8n_data:
