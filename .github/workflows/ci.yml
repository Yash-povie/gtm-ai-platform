name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: gtm, POSTGRES_PASSWORD: gtm_pass, POSTGRES_DB: gtm_platform }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gtm -d gtm_platform" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      neo4j:
        image: neo4j:5-community
        env: { NEO4J_AUTH: neo4j/neo4j_pass }
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p neo4j_pass 'RETURN 1'" --health-interval 10s --health-timeout 5s
          --health-retries 30
    env:
      GTM_ENV: sandbox
      DATABASE_URL: postgresql+asyncpg://gtm:gtm_pass@localhost:5432/gtm_platform
      REDIS_URL: redis://localhost:6379/0
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_pass
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy packages systems
      - name: Migrate
        run: |
          uv run alembic upgrade head
          uv run python scripts/apply_neo4j.py
      - name: Seed sandbox data
        run: uv run python scripts/seed_sandbox_data.py
      - name: Unit + integration tests
        run: uv run pytest tests/unit tests/integration -q
      - name: QA judge eval (every planted hallucination must be blocked)
        run: uv run pytest tests/evals -q
      - name: Demo harness smoke test
        run: uv run python scripts/demo_all.py > /dev/null
