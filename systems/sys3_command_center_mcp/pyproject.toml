[project]
name = "sys3-command-center-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sys1-autonomous-sdr",
    "gtm-core",
    "gtm-integrations",
    "gtm-safety",
    "sys4-outbound-qa",
    "sys5-lookalike-finder",
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sys3_command_center_mcp"]

[tool.uv.sources]
gtm-core = { workspace = true }
gtm-integrations = { workspace = true }
gtm-safety = { workspace = true }
sys4-outbound-qa = { workspace = true }
sys5-lookalike-finder = { workspace = true }
sys1-autonomous-sdr = { workspace = true }
