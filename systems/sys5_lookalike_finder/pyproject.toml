[project]
name = "sys5-lookalike-finder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gtm-core",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sys5_lookalike_finder"]

[tool.uv.sources]
gtm-core = { workspace = true }
