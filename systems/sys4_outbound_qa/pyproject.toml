[project]
name = "sys4-outbound-qa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gtm-core",
    "anthropic>=0.40",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sys4_outbound_qa"]

[tool.uv.sources]
gtm-core = { workspace = true }
